<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f1f4f6">
    <meta name="color-scheme" content="light">
    <meta name="robots" content="noindex">
    <meta name="description" content="Tiempos de bus de A Coruña. Proyecto personal no oficial, sin relación con Tranvías de La Coruña.">
    <title>ProyectoBus · Buses de A Coruña</title>
    <link rel="preload" as="font" type="font/woff2" href="fuentes/geist-latin.woff2" crossorigin>
    <link rel="preconnect" href="https://basemaps.cartocdn.com" crossorigin>
    <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="ruta.css">
</head>
<body>

<a class="saltar" href="#vista">Saltar al contenido</a>

<div class="app">
    <aside id="panel" class="panel" data-estado="medio">
        <button id="asa" class="asa" type="button" aria-label="Cambiar tamaño del panel"></button>

        <header class="marca">
            <svg class="marca-simbolo" width="28" height="20" viewBox="0 0 28 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
                <path d="M2 10h8M18 10h8"/>
                <circle cx="14" cy="10" r="4"/>
            </svg>
            <span class="marca-nombre" translate="no">ProyectoBus</span>
            <span class="marca-lugar">A Coruña</span>
        </header>

        <div class="buscador">
            <label class="solo-lectores" for="buscar">Buscar una parada o línea</label>
            <span class="buscador-icono" aria-hidden="true"></span>
            <input id="buscar" type="search" name="buscar" autocomplete="off" spellcheck="false"
                   placeholder="Busca parada o línea: Obelisco, 14…"
                   role="combobox" aria-expanded="false" aria-controls="resultados" aria-autocomplete="list">
            <ul id="resultados" class="resultados" role="listbox" aria-label="Resultados de búsqueda" hidden></ul>
            <p id="resultados-estado" class="resultados resultados-estado" role="status" aria-live="polite"></p>
        </div>

        <nav id="pestanas" class="pestanas" aria-label="Secciones"></nav>

        <main id="vista" class="vista" tabindex="-1"></main>

        <footer class="pie">Web no oficial, sin relación con Tranvías de La Coruña. Tiempos aproximados. <a href="?vista=aviso">Aviso legal</a></footer>
    </aside>

    <div id="mapa" class="mapa" role="application" aria-label="Mapa de paradas y recorridos"></div>
    <p id="aviso-mapa" class="aviso-mapa" role="status" aria-live="polite"></p>
    <button id="btn-ubicacion" class="btn-ubicacion" type="button" aria-label="Centrar en mi ubicación"></button>
</div>

<script src="vendor/leaflet/leaflet.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
