<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#14171d">
    <title>ProyectoBus · Buses de A Coruña</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="barra">
    <div class="marca">
        <span class="marca-icono">🚌</span>
        <span>ProyectoBus</span>
    </div>
    <div class="buscador">
        <input id="buscar" type="search" placeholder="Buscar parada…" autocomplete="off">
        <ul id="resultados" class="resultados" hidden></ul>
    </div>
</header>

<nav id="chips" class="chips" aria-label="Líneas"></nav>

<main id="mapa"></main>

<section id="panel" class="panel" hidden>
    <div class="panel-asa"></div>
    <div class="panel-cabecera">
        <div>
            <h2 id="panel-titulo">Parada</h2>
            <p id="panel-sub" class="sub"></p>
        </div>
        <div class="panel-acciones">
            <button id="btn-fav" class="icono" title="Guardar como favorita">☆</button>
            <button id="btn-cerrar" class="icono" title="Cerrar">✕</button>
        </div>
    </div>
    <div id="panel-cuerpo" class="panel-cuerpo"></div>
</section>

<div id="aviso" class="aviso" hidden></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="app.js"></script>
</body>
</html>
